<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h2>تسجيل الدخول - المشرف</h2>
            <input type="password" id="adminPassword" placeholder="كلمة المرور" class="password-input">
            <button id="loginBtn" class="login-btn">دخول</button>
            <div id="loginError" class="error-message hidden"></div>
        </div>

        <!-- Admin Dashboard (hidden until login) -->
        <div id="dashboardSection" class="dashboard hidden">
            <div class="admin-header">
                <h1>لوحة تحكم المشرف</h1>
                <button id="logoutBtn" class="logout-btn">تسجيل خروج</button>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <h3>إجمالي المبيعات المعتمدة</h3>
                    <p id="totalSales">0 ج.م</p>
                </div>
                <button id="exportExcelBtn" class="export-btn">📊 تحميل تقرير Excel</button>
            </div>

            <!-- Reservations Table -->
            <div class="reservations-table">
                <h2>الطلبات</h2>
                <div id="reservationsList"></div>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
